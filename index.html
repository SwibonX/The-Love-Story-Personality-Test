<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱情故事测试 - 发现你的潜意识爱情剧本</title>
    <style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 700px;
}

.screen {
    display: none;
    background: white;
    border-radius: 24px;
    padding: 48px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    animation: fadeIn 0.3s ease;
}

.screen.active {
    display: block;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.header {
    text-align: center;
    margin-bottom: 40px;
}

.header h1 {
    font-size: 36px;
    color: #333;
    margin-bottom: 8px;
}

.subtitle {
    color: #888;
    font-size: 16px;
}

.intro {
    margin-bottom: 40px;
}

.intro-card {
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 32px;
}

.intro-card h2 {
    font-size: 24px;
    color: #333;
    margin-bottom: 16px;
}

.intro-card p {
    color: #555;
    line-height: 1.8;
    font-size: 16px;
}

.intro-stats {
    display: flex;
    justify-content: space-around;
}

.stat {
    text-align: center;
}

.stat-number {
    font-size: 48px;
    font-weight: bold;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.stat-label {
    color: #666;
    font-size: 14px;
    margin-top: 8px;
}

.btn {
    width: 100%;
    padding: 16px 32px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn.primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
}

.btn.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
}

.btn.secondary {
    background: #f0f0f0;
    color: #666;
}

.btn.secondary:hover {
    background: #e0e0e0;
}

.progress-bar {
    position: relative;
    height: 8px;
    background: #e0e0e0;
    border-radius: 4px;
    margin-bottom: 40px;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 4px;
    transition: width 0.3s ease;
    width: 0%;
}

.progress-text {
    position: absolute;
    right: 0;
    top: -30px;
    color: #666;
    font-size: 14px;
}

.question-container {
    margin-bottom: 40px;
}

.question-number {
    color: #667eea;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
}

.question-text {
    font-size: 22px;
    color: #333;
    line-height: 1.6;
    margin-bottom: 32px;
}

.options {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.option {
    padding: 20px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 16px;
    color: #333;
}

.option:hover {
    border-color: #667eea;
    background: #f5f3ff;
}

.option.selected {
    border-color: #667eea;
    background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
}

.nav-buttons {
    display: flex;
    justify-content: center;
}

.nav-buttons .btn {
    max-width: 300px;
}

.result-header {
    text-align: center;
    margin-bottom: 40px;
}

.result-header h1 {
    font-size: 32px;
    color: #333;
}

.primary-personality {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 20px;
    padding: 40px;
    color: white;
    text-align: center;
    margin-bottom: 32px;
}

.personality-badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.3);
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 14px;
    margin-bottom: 16px;
}

.primary-personality h2 {
    font-size: 36px;
    margin-bottom: 16px;
}

.primary-personality p {
    font-size: 18px;
    line-height: 1.8;
    opacity: 0.95;
}

.secondary-personalities {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
}

.secondary-card {
    background: #f5f7fa;
    border-radius: 16px;
    padding: 24px;
}

.secondary-card h4 {
    color: #667eea;
    margin-bottom: 8px;
    font-size: 18px;
}

.secondary-card p {
    color: #666;
    font-size: 14px;
    line-height: 1.6;
}

.combination-analysis {
    background: #fff0f5;
    border-left: 4px solid #ff6b9d;
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 32px;
}

.combination-analysis h3 {
    color: #ff6b9d;
    font-size: 20px;
    margin-bottom: 16px;
}

.combination-analysis .analysis-text {
    color: #333;
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 16px;
}

.combination-analysis .pain-point {
    background: rgba(255, 107, 157, 0.1);
    border-radius: 12px;
    padding: 16px 20px;
}

.combination-analysis .pain-point-title {
    color: #ff6b9d;
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 8px;
}

.combination-analysis .pain-point-text {
    color: #555;
    font-size: 14px;
    line-height: 1.7;
}

.dimensions {
    background: #fafafa;
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 32px;
}

.dimensions h3 {
    color: #333;
    margin-bottom: 24px;
    font-size: 20px;
}

.dimension-bars {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.dimension-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.dimension-label {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #666;
}

.dimension-score {
    font-weight: 600;
    color: #667eea;
}

.dimension-track {
    height: 12px;
    background: #e0e0e0;
    border-radius: 6px;
    overflow: hidden;
}

.dimension-fill {
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 6px;
    transition: width 0.5s ease;
}

.dimension-full-tip {
    background: #fafbff;
    border: 1px solid #e8ecf4;
    border-radius: 10px;
    padding: 14px;
    margin-top: 4px;
}

.tip-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 4px 0;
}

.tip-row + .tip-row {
    border-top: 1px dashed #e8ecf4;
    margin-top: 4px;
    padding-top: 8px;
}

.tip-tag {
    flex-shrink: 0;
    font-weight: 700;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
}

.tip-tag.high {
    background: #ffe0e0;
    color: #d63031;
}

.tip-tag.low {
    background: #e0f0ff;
    color: #0984e3;
}

.tip-text {
    font-size: 12px;
    color: #555;
    line-height: 1.6;
}

/* ===== 新增：次要人格得分条 ===== */

.sec-bar-track {
    height: 6px;
    background: #e0e0e0;
    border-radius: 3px;
    margin-top: 10px;
    overflow: hidden;
}

.sec-bar-fill {
    height: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 3px;
    transition: width 0.5s ease;
}

</style>
</head>
<body>
    <div class="container">
        <div id="start-screen" class="screen active">
            <div class="header">
                <h1>爱情故事测试</h1>
                <p class="subtitle">基于斯滕伯格《爱情是一个故事》原著</p>
            </div>
            <div class="intro">
                <div class="intro-card">
                    <h2>发现你的潜意识爱情剧本</h2>

                </div>
                <div class="intro-stats">
                    <div class="stat">
                        <div class="stat-number">25</div>
                        <div class="stat-label">种爱情故事</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">100</div>
                        <div class="stat-label">道测试题</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">5</div>
                        <div class="stat-label">大维度</div>
                    </div>
                </div>
            </div>
            <button id="start-btn" class="btn primary">开始测试</button>
        </div>

        <div id="question-screen" class="screen">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
                <div class="progress-text">
                    <span id="current-question">1</span>/<span id="total-questions">100</span>
                </div>
            </div>
            <div class="question-container">
                <div class="question-number" id="question-number">第 1 题</div>
                <div class="question-text" id="question-text"></div>
                <div class="options" id="options-container"></div>
            </div>
            <div class="nav-buttons">
                <button id="prev-btn" class="btn secondary">上一题</button>
                <button id="next-btn" class="btn primary">下一题</button>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <div class="result-header">
                <h1>你的爱情故事结果</h1>
            </div>
            <div class="result-content">
                <div class="primary-personality">
                    <div class="personality-badge">主导人格</div>

                    <p id="primary-desc"></p>
                </div>
                <div class="combination-analysis" id="combination-container"></div>
                <div class="secondary-personalities" id="secondary-container"></div>
                <div class="dimensions">
                    <h3>5大维度得分</h3>
                    <div class="dimension-bars" id="dimension-bars"></div>
                </div>
            </div>
            <button id="restart-btn" class="btn primary">重新测试</button>
        </div>
    </div>
    <script>const questions = [

    { text: "我觉得自己在感情中像老师，喜欢教导和启发对方", dimension: "unequal", type: "teacher", options: ["非常不符合", "不太符合", "一般", "比较符合", "非常符合"] },

const dimensionNames = {
    unequal: "不对等故事",
    object: "客体故事",
    collaboration: "协作故事",
    narrative: "叙事故事",
    style: "类型故事"
};

const dimensionDescriptions = {
    unequal: {
        title: "不对等故事（权力型）",
        desc: "测量你在爱情里的权力、付出、控制倾向。",
        high: "要么强势控制、要么过度付出，关系容易不对等，爱里带着明显的权力感或牺牲感。",
        low: "追求平等、尊重边界，不爱控制、不愿过度牺牲，要的是双向对等的关系。"
    },
    object: {
        title: "客体故事（工具型）",
        desc: "测量你是否不自觉地把人或关系当作工具、条件、手段。",
        high: "看重颜值、条件、救赎、新鲜感，容易把伴侣当成门面、跳板或疗愈工具。",
        low: "纯粹重感情、重人本身，不看附加条件，不功利、不把爱情当成实现目的的手段。"
    },
    collaboration: {
        title: "协作故事（伙伴型）",
        desc: "测量你把爱情看作并肩经营、共同成长的伙伴关系的程度。",
        high: "重视陪伴、责任、长期稳定，愿意共同规划、一起解决问题，把感情当事业用心经营。",

    },
    narrative: {
        title: "叙事故事（剧本型）",
        desc: "测量你心里那套理想爱情剧本对感情的影响程度。",
        high: "有固定的爱情观，相信宿命、童话、公式，容易用理想对照现实，也容易因此失望。",

        low: "务实理性、不看重花哨的氛围，更在意踏实、简单、直接的相处方式，讨厌情绪拉扯。"

let currentQuestion = 0;
let answers = [];
let scores = {
    unequal: 0,
    object: 0,
    collaboration: 0,
    narrative: 0,
    style: 0
};
let typeScores = {};

const startScreen = document.getElementById('start-screen');
const questionScreen = document.getElementById('question-screen');
const resultScreen = document.getElementById('result-screen');
const startBtn = document.getElementById('start-btn');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const restartBtn = document.getElementById('restart-btn');

startBtn.addEventListener('click', startTest);
prevBtn.addEventListener('click', prevQuestion);
nextBtn.addEventListener('click', nextQuestion);
restartBtn.addEventListener('click', restartTest);

function startTest() {
    startScreen.classList.remove('active');
    questionScreen.classList.add('active');
    currentQuestion = 0;
    answers = [];
    scores = { unequal: 0, object: 0, collaboration: 0, narrative: 0, style: 0 };
    typeScores = {};
    showQuestion();
}

function showQuestion() {
    const q = questions[currentQuestion];
    document.getElementById('question-number').textContent = '第 ' + (currentQuestion + 1) + ' 题';
    document.getElementById('question-text').textContent = q.text;
    document.getElementById('current-question').textContent = currentQuestion + 1;
    document.getElementById('total-questions').textContent = questions.length;
    document.getElementById('progress-fill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';

    const container = document.getElementById('options-container');
    container.innerHTML = '';
    q.options.forEach((opt, i) => {
        const el = document.createElement('div');
        el.className = 'option';
        el.textContent = opt;
        el.addEventListener('click', function() { selectOption(i); });
        if (answers[currentQuestion] === i) el.classList.add('selected');
        container.appendChild(el);
    });

    prevBtn.style.display = currentQuestion > 0 ? 'block' : 'none';
    nextBtn.style.display = 'none';
}

function selectOption(index) {
    answers[currentQuestion] = index;
    var opts = document.querySelectorAll('.option');
    opts.forEach(function(o, i) { o.classList.toggle('selected', i === index); });

    setTimeout(function() {
        if (currentQuestion < questions.length - 1) {
            currentQuestion++;
            showQuestion();
        } else {
            calculateResults();
        }
    }, 300);
}

function nextQuestion() {
    if (answers[currentQuestion] === undefined) return;
    if (currentQuestion < questions.length - 1) { currentQuestion++; showQuestion(); }
    else { calculateResults(); }
}

function prevQuestion() {
    if (currentQuestion > 0) { currentQuestion--; showQuestion(); }
}

function calculateResults() {
    // 1. 计算各类型原始总分和维度总分
    questions.forEach(function(q, i) {
        var sc = answers[i] + 1; // 1-5分
        scores[q.dimension] += sc;
        if (!typeScores[q.type]) {
            typeScores[q.type] = { raw: 0, count: 0, avg: 0 };
        }
        typeScores[q.type].raw += sc;
        typeScores[q.type].count += 1;
    });

    // 2. 计算每个类型的平均分（标准化，消除题目数量差异）
    var typeAvgs = {};
    for (var t in typeScores) {
        typeScores[t].avg = typeScores[t].raw / typeScores[t].count;
        typeAvgs[t] = typeScores[t].avg;
    }

    // 3. 计算每个维度的平均分（用于展示）
    var dimCounts = {};
    questions.forEach(function(q) {
        dimCounts[q.dimension] = (dimCounts[q.dimension] || 0) + 1;
    });
    var dimAvgs = {};
    for (var d in scores) {
        dimAvgs[d] = scores[d] / dimCounts[d];
    }

    // 4. 从所有25个类型中找出主导人格（按平均分排序，公平比较）
    var sortedTypes = Object.keys(typeAvgs).sort(function(a, b) {
        return typeAvgs[b] - typeAvgs[a];
    });
    var maxType = sortedTypes[0];

    // 5. 找出次要人格（排除主导人格后的前2名）
    var secTypes = [];
    for (var i = 1; i < sortedTypes.length && secTypes.length < 2; i++) {
        secTypes.push(sortedTypes[i]);
    }

    // 6. 找出最高维度（用于组合分析参考）
    var sortedDims = Object.keys(dimAvgs).sort(function(a, b) {
        return dimAvgs[b] - dimAvgs[a];
    });

    showResult(maxType, secTypes, dimAvgs, typeAvgs);
}

function showResult(primaryType, secondaryTypes, dimAvgs, typeAvgs) {
    questionScreen.classList.remove('active');
    resultScreen.classList.add('active');

    // 主导人格
    document.getElementById('primary-name').textContent = personalities[primaryType].name;
    document.getElementById('primary-desc').textContent = personalities[primaryType].desc;

    // 组合分析
    var cc = document.getElementById('combination-container');
    cc.innerHTML = '';
    var found = null;
    for (var i = 0; i < secondaryTypes.length; i++) {
        var k1 = primaryType + '+' + secondaryTypes[i];
        var k2 = secondaryTypes[i] + '+' + primaryType;
        if (combinations[k1]) { found = combinations[k1]; break; }
        if (combinations[k2]) { found = combinations[k2]; break; }
    }
    if (found) {
        cc.innerHTML = '<h3>' + found.title + '</h3><div class="analysis-text">' + found.analysis + '</div><div class="pain-point"><div class="pain-point-title">⚠️ 痛点提醒</div><div class="pain-point-text">' + found.pain + '</div></div>';
    } else {
        cc.innerHTML = '<h3>你的爱情故事</h3><div class="analysis-text">你的主导人格是「' + personalities[primaryType].name + '」，辅以「' + personalities[secondaryTypes[0]].name + '」和「' + personalities[secondaryTypes[1]].name + '」。这是一种独特的组合，既有' + personalities[primaryType].name + '的核心特质，又兼具其他维度的色彩。</div>';
    }

    // 次要人格（只显示标准化进度条，不显示具体得分）
    var sc = document.getElementById('secondary-container');
    sc.innerHTML = '';
    secondaryTypes.forEach(function(t) {
        var avg = typeAvgs[t];
        var pct = Math.round((avg / 5) * 100);
        var card = document.createElement('div');
        card.className = 'secondary-card';
        card.innerHTML = '<h4>' + personalities[t].name + '</h4><p>' + personalities[t].desc + '</p><div class="sec-bar-track"><div class="sec-bar-fill" style="width:' + pct + '%"></div></div>';
        sc.appendChild(card);
    });

    // 维度得分（显示标准化百分比）
    var db = document.getElementById('dimension-bars');
    db.innerHTML = '';
    var dimOrder = ['collaboration', 'style', 'narrative', 'unequal', 'object'];
    dimOrder.forEach(function(dim) {
        var avg = dimAvgs[dim];
        var pct = Math.round((avg / 5) * 100);
        var desc = dimensionDescriptions[dim];
        var item = document.createElement('div');
        item.className = 'dimension-item';
        item.innerHTML =
            '<div class="dimension-label"><span>' + desc.title + '</span><span class="dimension-score">' + pct + '%</span></div>' +
            '<div class="dimension-track"><div class="dimension-fill" style="width:' + pct + '%"></div></div>' +
            '<div class="dimension-full-tip">' +
                '<div class="tip-row"><span class="tip-tag high">▲ 高分</span><span class="tip-text">' + desc.high + '</span></div>' +
                '<div class="tip-row"><span class="tip-tag low">▼ 低分</span><span class="tip-text">' + desc.low + '</span></div>' +
            '</div>';
        db.appendChild(item);
    });

}

function restartTest() {
    resultScreen.classList.remove('active');
    startScreen.classList.add('active');
}
</script>
